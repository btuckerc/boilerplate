onboarding = false

[ui.toast]
delivery = "system"

[session]
resume_agents_on_restore = true

[worktrees]
directory = "~/src/worktrees"

[remote]
manage_ssh_config = true

[experimental]
pane_history = false

[ui]
status_indicators = "symbols"
agent_panel_sort = "priority"
prompt_new_tab_name = false

[ui.sidebar.agents]
rows = [["state_icon", "workspace"]]

[ui.sidebar.spaces]
rows = [["state_icon", "workspace"]]

[theme]
name = "terminal"
auto_switch = false
