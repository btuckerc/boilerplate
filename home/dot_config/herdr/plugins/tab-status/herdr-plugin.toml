id = "decent-angl.tab-status"
name = "Tab status"
version = "0.1.0"
min_herdr_version = "0.9.1"
description = "Append each tab's agent state (× blocked, ◐ working, ✓ done, ○ idle) to its label"
platforms = ["linux", "macos"]

[[startup]]
command = ["python3", "tab_status.py"]

[[events]]
on = "pane.agent_status_changed"
command = ["python3", "tab_status.py"]

[[events]]
on = "pane.agent_detected"
command = ["python3", "tab_status.py"]

[[events]]
on = "pane.closed"
command = ["python3", "tab_status.py"]

[[events]]
on = "pane.exited"
command = ["python3", "tab_status.py"]

[[events]]
on = "tab.created"
command = ["python3", "tab_status.py"]

[[events]]
on = "tab.closed"
command = ["python3", "tab_status.py"]

[[events]]
on = "tab.moved"
command = ["python3", "tab_status.py"]

# Focusing a finished tab marks it seen: ✓ done becomes ○ idle.
[[events]]
on = "tab.focused"
command = ["python3", "tab_status.py"]

[[events]]
on = "pane.focused"
command = ["python3", "tab_status.py"]

[[events]]
on = "workspace.focused"
command = ["python3", "tab_status.py"]
