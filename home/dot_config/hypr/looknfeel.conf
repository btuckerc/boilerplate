# Change the default Omarchy look'n'feel

# https://wiki.hyprland.org/Configuring/Variables/#general
general {
    gaps_in = 2
    gaps_out = 0
    border_size = 0

    # Change to niri-like side-scrolling layout
    # layout = scrolling
}

# Restore chrome when two or more tiled windows are visible.
# Do not set windowrule rounding. It sticks after the selector stops matching.
workspace = w[tv1] s[false], gapsout:0, bordersize:0
workspace = w[tv2-99] s[false], gapsout:4, gapsin:2, bordersize:2

# https://wiki.hyprland.org/Configuring/Variables/#decoration
decoration {
    rounding = 0

    shadow {
        enabled = false
    }

    blur {
        enabled = false
    }
}

# https://wiki.hyprland.org/Configuring/Variables/#animations
animations {
    enabled = no
}

# https://wiki.hypr.land/Configuring/Variables/#layout
layout {
    # Avoid overly wide single-window layouts on wide screens
    # single_window_aspect_ratio = 1 1
}

misc {
    # Keep background Codex/terminal workspaces from stealing focus.
    focus_on_activate = false
}

windowrule = opacity 1.0 1.0, match:tag default-opacity
