[tools]
# Exact pins keep every host identical. Bump with `mise outdated`, edit here,
# publish, then `mise install` on each host. Bare names use mise's registry
# default backend (aqua release binaries unless noted).

# Runtimes: stay on current LTS/stable lines; take major bumps deliberately.
python = "3.13.15"
uv = "0.12.18"
bun = "1.4.2"
node = "24.21.0"
go = "1.27.1"
ruby = "3.4.10"

# Coding harnesses. OMP and Codex pins are checked by check_baseline.py and
# must match omp-baseline-manifest.tsv and run_onchange_after_04-setup-omp.
"github:can1357/oh-my-pi" = "18.2.11"
codex = "0.155.1"
herdr = "0.9.1"
opencode = "1.18.32"

# CLI tools
chezmoi = "2.72.2"
starship = "1.26.0"
zoxide = "0.10.0"
fzf = "0.74.4"
bat = "0.26.1"
fd = "10.5.0"
yazi = "26.9.1"
jq = "1.8.2"
gum = "0.17.0"
lazygit = "0.65.1"
tree-sitter = "0.27.0"
carapace = "1.7.3"
ripgrep = "15.2.0"
tmux = "3.7c"
gh = "2.101.0"
restic = "0.19.1"
"npm:@bitwarden/cli" = "2026.9.0"
# The registry default for neovim is a vfox plugin; aqua uses release binaries.
"aqua:neovim/neovim" = "0.12.5"

# Language servers and formatters
"npm:typescript-language-server" = "5.3.0"
"npm:typescript" = "6.0.3"
"npm:pyright" = "1.1.414"
"npm:yaml-language-server" = "1.24.0"
"npm:vscode-langservers-extracted" = "4.10.0"
"npm:bash-language-server" = "5.8.1"
"npm:dockerfile-language-server-nodejs" = "0.15.0"
"npm:prettier" = "3.9.8"
"npm:@playwright/mcp" = "0.0.82"
"go:golang.org/x/tools/gopls" = "latest"
"go:golang.org/x/tools/cmd/goimports" = "latest"
"go:mvdan.cc/gofumpt" = "latest"
"go:mvdan.cc/sh/v3/cmd/shfmt" = "latest"
"pipx:black" = "26.5.1"
"pipx:yubikey-manager" = "5.9.2"
lua-language-server = "3.19.1"
rust-analyzer = "2026-09-21"
terraform-ls = "0.39.0"
stylua = "2.5.2"
"gem:solargraph" = "0.60.4"
"gem:rails" = "8.1.3.1"

[settings]
experimental = true
legacy_version_file = true
always_keep_download = false
plugin_autoupdate_last_check_duration = "7d"
jobs = 2
verbose = false
# Keep operational one-offs like `mise exec -- chezmoi ...` from hydrating
# unrelated missing editor/dev tools. Use `mise install` when preparing tools.
exec_auto_install = false
asdf_compat = true
color = true
task.output = "prefix"
http_timeout = "120"
raw = false

[hooks]
preinstall = "bash ${XDG_CONFIG_HOME:-$HOME/.config}/mise/hooks/preinstall"

[env]
# Tools installed by mise (e.g. Ruby builds needing `python`) resolve siblings.
_.path = ["~/.local/share/mise/shims"]

[settings.pipx]
uvx = true

[settings.npm]
bun = true
