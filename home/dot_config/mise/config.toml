[tools]
# Exact pins keep every host identical. Bump with `mise outdated`, edit here,
# then publish with `decent-angl-sync reconcile`; host guards install the pins.
# Bare names use mise's registry default backend (aqua binaries unless noted).

# Runtimes: stay on current LTS/stable lines; take major bumps deliberately.
python = "3.13.17"
uv = "0.13.5"
bun = "1.4.3"
node = "24.22.1"
go = "1.27.3"
ruby = "3.4.11"

# Coding harness pins are checked by check_baseline.py.
# The OMP pin must match omp-baseline-manifest.tsv.
"github:can1357/oh-my-pi" = "18.16.0"
codex = "0.166.0"
# Director harness; settings.json disables its self-updater so this pin holds.
"npm:@anthropic-ai/claude-code" = "2.1.319"
herdr = "0.9.5"
opencode = "1.19.5"

# CLI tools
chezmoi = "2.73.3"
starship = "1.27.0"
zoxide = "0.10.0"
fzf = "0.74.5"
bat = "0.26.1"
fd = "10.5.0"
yazi = "26.9.1"
jq = "1.8.2"
gum = "0.17.0"
lazygit = "0.66.2"
tree-sitter = "0.27.1"
carapace = "1.8.1"
ripgrep = "15.2.0"
tmux = "3.7c"
gh = "2.103.0"
restic = "0.19.1"
"npm:@bitwarden/cli" = "2026.10.0"
# Cloudflare CLI (beta); needs Node at runtime, not Bun.
"npm:cf" = "1.0.0-beta.10"
# Web data CLIs (skill web-data); keys come from ~/.omp/agent/.env via omp-env.
"github:parallel-web/parallel-web-tools" = "0.9.4"
"npm:firecrawl-cli" = "1.26.24"
# The registry default for neovim is a vfox plugin; aqua uses release binaries.
"aqua:neovim/neovim" = "0.12.6"

# Language servers and formatters
"npm:typescript-language-server" = "5.3.0"
"npm:typescript" = "6.0.3"
"npm:pyright" = "1.1.414"
"npm:yaml-language-server" = "1.24.0"
"npm:vscode-langservers-extracted" = "4.10.0"
"npm:bash-language-server" = "5.8.1"
"npm:dockerfile-language-server-nodejs" = "0.15.0"
"npm:prettier" = "3.9.10"
"npm:@playwright/mcp" = "0.0.83"
"go:golang.org/x/tools/gopls" = "latest"
"go:golang.org/x/tools/cmd/goimports" = "latest"
"go:mvdan.cc/gofumpt" = "latest"
"go:mvdan.cc/sh/v3/cmd/shfmt" = "latest"
"pipx:black" = "26.10.1"
"pipx:yubikey-manager" = "5.9.2"
lua-language-server = "3.19.2"
rust-analyzer = "2026-10-19"
terraform-ls = "0.39.0"
stylua = "2.6.0"
"gem:solargraph" = "0.61.0"
"gem:rails" = "8.1.4"

[settings]
# Omarchy's /etc/mise/conf.d/omarchy-tools.toml declares these as `latest` with
# 4-hourly auto-update under different keys than the pins above, so they would
# install beside the pins (and stall `mise exec omp` on a download).
disable_tools = ["oh-my-pi", "claude"]
experimental = true
legacy_version_file = true
jobs = 2
verbose = false
# Keep operational one-offs like `mise exec -- chezmoi ...` from hydrating
# unrelated missing editor/dev tools. Use `mise install` when preparing tools.
exec_auto_install = false
asdf_compat = true
color = true
task.output = "prefix"
http_timeout = "120"
raw = false

[hooks]
preinstall = "bash ${XDG_CONFIG_HOME:-$HOME/.config}/mise/hooks/preinstall"

[settings.pipx]
uvx = true

[settings.npm]
bun = true

# Google's Antigravity CLI from its release channel
# (https://antigravity-cli-auto-updater-974169037036.us-central1.run.app/manifests/<os>_<arch>.json),
# pinned with sha512 as T3 Code installs it. Run it through the `agy` wrapper: it is on Tucker's
# personal Google sign-in, for his own interactive use only. Bump version, URLs and checksums together.
[tools."http:antigravity"]
version = "1.5.13"
bin_path = "."
[tools."http:antigravity".platforms]
linux-x64 = { url = "https://storage.googleapis.com/antigravity-public/antigravity-cli/1.5.13-5999302598852608/linux-x64/cli_linux_x64.tar.gz", checksum = "sha512:014b37387703acab1f47cd532c8bb60167a6a3537b0f9891de03f1b1ffa9614307bc83c4b2f7551273b0877d722716b0cd9e26782f6b2a50705db4f05e18c68f" }
linux-arm64 = { url = "https://storage.googleapis.com/antigravity-public/antigravity-cli/1.5.13-5999302598852608/linux-arm/cli_linux_arm64.tar.gz", checksum = "sha512:dccea2eb455099f5175f0c87cc47b38fcefe4cb0cb44dea3927469bb4bbf68ac3c0b30fc04affb24c17e90959386a93c3785e8e4b8b1a3338ca4e4d57b80057b" }
macos-arm64 = { url = "https://storage.googleapis.com/antigravity-public/antigravity-cli/1.5.13-5999302598852608/darwin-arm/cli_mac_arm64.tar.gz", checksum = "sha512:d9825ebce6954df6b7841970fd7ef3d37acdfe628993f14c396ec73b20ed06bbe95e7b7be047e7c0b0baaf009f75fe95ce051b9f4af5e84b002da15bda4a1f45" }
macos-x64 = { url = "https://storage.googleapis.com/antigravity-public/antigravity-cli/1.5.13-5999302598852608/darwin-x64/cli_mac_x64.tar.gz", checksum = "sha512:6a7087eb847029bead89d496a6c4a5d3ec8552f351a486b3917948fee2a9a72ec6e2be7eae866b975b8ed3fc2a1827cf176b5bd45d6eb9970424fec4352d3930" }
