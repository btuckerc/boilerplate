# ThinkPad T14 Gen 1 speaker tuning.
#
# Five stereo biquads, then LSP compressor_stereo, then LSP limiter_stereo.
# Numbers are a first conservative voicing. They are not from a microphone
# measurement. See tuning.conf.
#
# Channels are wired explicitly because the compressor and limiter are stereo
# plugins. A mono graph is duplicated per channel and would process each side
# independently.

context.modules = [
  { name = libpipewire-module-filter-chain
    args = {
      node.description = "Tuned Speakers"
      media.name       = "Tuned Speakers"

      filter.graph = {
        nodes = [
          { type = builtin name = s0_l      label = bq_highpass  control = { "Freq" = 80.0 "Q" = 0.7 } }
          { type = builtin name = s1_l      label = bq_lowshelf  control = { "Freq" = 180.0 "Q" = 0.7 "Gain" = 2.5 } }
          { type = builtin name = s2_l      label = bq_peaking   control = { "Freq" = 3500.0 "Q" = 1.2 "Gain" = -3.5 } }
          { type = builtin name = s3_l      label = bq_peaking   control = { "Freq" = 6000.0 "Q" = 1.4 "Gain" = -2.5 } }
          { type = builtin name = s4_l      label = bq_highshelf control = { "Freq" = 8000.0 "Q" = 0.7 "Gain" = -2.0 } }

          { type = builtin name = s0_r      label = bq_highpass  control = { "Freq" = 80.0 "Q" = 0.7 } }
          { type = builtin name = s1_r      label = bq_lowshelf  control = { "Freq" = 180.0 "Q" = 0.7 "Gain" = 2.5 } }
          { type = builtin name = s2_r      label = bq_peaking   control = { "Freq" = 3500.0 "Q" = 1.2 "Gain" = -3.5 } }
          { type = builtin name = s3_r      label = bq_peaking   control = { "Freq" = 6000.0 "Q" = 1.4 "Gain" = -2.5 } }
          { type = builtin name = s4_r      label = bq_highshelf control = { "Freq" = 8000.0 "Q" = 0.7 "Gain" = -2.0 } }

          { type   = lv2
            name   = compressor
            plugin = "http://lsp-plug.in/plugins/lv2/compressor_stereo"
            control = {
              "ssplit" = 0
              "al"     = 0.12589
              "at"     = 20.0
              "rt"     = 200.0
              "cr"     = 2.0
              "mk"     = 1.4125
            }
          }
          { type   = lv2
            name   = limiter
            plugin = "http://lsp-plug.in/plugins/lv2/limiter_stereo"
            control = {
              # Both default to enabled: "alr" regulates level toward the
              # threshold and "boost" normalises the threshold up to full
              # scale. A fixed tuning must switch them off or its tone drifts
              # with programme level.
              "alr"   = 0
              "boost" = 0
              "th"    = 0.891
              "g_in"  = 0.7
            }
          }
        ]

        links = [
          { output = "s0_l:Out" input = "s1_l:In" }
          { output = "s1_l:Out" input = "s2_l:In" }
          { output = "s2_l:Out" input = "s3_l:In" }
          { output = "s3_l:Out" input = "s4_l:In" }
          { output = "s4_l:Out" input = "compressor:in_l" }
          { output = "compressor:out_l" input = "limiter:in_l" }
          { output = "s0_r:Out" input = "s1_r:In" }
          { output = "s1_r:Out" input = "s2_r:In" }
          { output = "s2_r:Out" input = "s3_r:In" }
          { output = "s3_r:Out" input = "s4_r:In" }
          { output = "s4_r:Out" input = "compressor:in_r" }
          { output = "compressor:out_r" input = "limiter:in_r" }
        ]

        inputs  = [ "s0_l:In" "s0_r:In" ]
        outputs = [ "limiter:out_l" "limiter:out_r" ]
      }

      audio.channels = 2
      audio.position = [ FL FR ]

      capture.props = {
        node.name   = "tux_speaker_tune"
        media.class = Audio/Sink
      }
      playback.props = {
        # The stock audio panel hides playback streams whose name starts with
        # "omarchy_speaker_tuning" (a tuning's output is not an app). Matching
        # that prefix keeps this one out of its SOURCES list too.
        node.name     = "omarchy_speaker_tuning_tux_output"
        node.passive  = true
        target.object = "@SPEAKER_SINK@"
        # This stream is the filter's output and is a movable sink input like any
        # other, so anything that reroutes "all streams" to a newly selected
        # output would drag the processing along with it -- onto headphones, or
        # into the tuning's own sink, which is a cycle. Pin it.
        node.dont-move = true
        # If the speaker sink is not present yet -- the tuning host can start
        # before the device is discovered -- WirePlumber would otherwise link this
        # output to whatever default exists, quietly tuning the wrong device while
        # the tuning sink still looks healthy. Wait for the named target instead.
        # Both are needed: without linger, WirePlumber destroys the node rather
        # than waiting (see its scripts/linking/find-defined-target.lua).
        node.dont-fallback = true
        node.linger = true
      }
    }
  }
]
