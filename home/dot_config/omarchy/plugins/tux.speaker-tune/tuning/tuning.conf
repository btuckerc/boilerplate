## ThinkPad T14 Gen 1 internal speakers.
##
## Five biquads, a stereo compressor, and a stereo limiter, applied as a
## PipeWire filter-chain in front of the analog stereo sink. Numbers are a
## first conservative voicing. They are not from a microphone measurement.

description="ThinkPad T14 Gen 1 speakers"
## Matched on DMI product_version, which is "ThinkPad T14 Gen 1" on this chassis.
match_dmi=("ThinkPad T14 Gen 1")
## Unescaped dots: this is passed to awk as a string, where a backslash escape
## would be consumed before the regex sees it.
sink_pattern='^alsa_output.*analog-stereo$'

## Unmeasured. No calibrated mic. Do not treat these figures as a fitted match.
validated_hardware="ThinkPad T14 Gen 1 ALC257"
