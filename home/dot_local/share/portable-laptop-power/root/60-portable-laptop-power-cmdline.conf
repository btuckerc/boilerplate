# FADT claims ASPM is unsupported. Force OS control so the battery policy
# can write pcie_aspm=powersave. nmi_watchdog is a debug timer.
KERNEL_CMDLINE[default]+=" pcie_aspm=force nmi_watchdog=0"
# Panel Self Refresh. amdgpu leaves PSR off on DCN < 3.1 (Renoir is DCN 2.1)
# unless DC_PSR_MASK (0x8) is set; 0x402 is this kernel's default mask, so
# 0x40a only adds PSR. The eDP panel reports PSR support. Runtime off switch:
# echo 1 > /sys/kernel/debug/dri/1/eDP-1/disallow_edp_enter_psr (then DPMS cycle).
# Remove this line and run limine-mkinitcpio to roll back.
KERNEL_CMDLINE[default]+=" amdgpu.dcfeaturemask=0x40a"
