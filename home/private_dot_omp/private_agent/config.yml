# Managed by chezmoi. Auth stays machine-local (agent.db / ~/.omp/agent/.env).
# Routing principles:
# - Burn SuperGrok (xai-oauth/grok-4.6) only on default, slow, and plan.
# - Burn Antigravity Gemini 3.8 (google-antigravity, not Vertex, not
#   google-gemini-cli) on vision, smol, task, and tiny first.
# - Burn OpenRouter GLM-5.3-Flash on commit, and as the fallback when
#   Antigravity 429s.
# - Prefer first-party SuperGrok over OpenRouter Grok.
# - Prefer Antigravity Gemini over paid OpenRouter Gemini.
modelRoles:
  default: xai-oauth/grok-4.6:medium
  slow: xai-oauth/grok-4.6:xhigh
  plan: xai-oauth/grok-4.6:high
  vision: google-antigravity/gemini-3.8-flash:high
  commit: openrouter/z-ai/glm-5.3-flash:low
  smol: google-antigravity/gemini-3.8-flash
  tiny: google-antigravity/gemini-3.8-flash:low
  task: google-antigravity/gemini-3.8-flash

modelProviderOrder:
  - xai-oauth
  - google-antigravity
  - openrouter

cycleOrder:
  - default
  - google-antigravity/gemini-3.8-flash

enabledModels:
  - xai-oauth/grok-4.6
  - google-antigravity/gemini-3.8-flash
  - xai-oauth/grok-composer-2.5-fast
  - openrouter/x-ai/grok-4.6
  - openrouter/x-ai/grok-4.6:nitro
  - openrouter/openai/gpt-5.6-luna
  - openrouter/z-ai/glm-5.3-flash
  - openrouter/z-ai/glm-5.3
  - openrouter/moonshotai/kimi-k3

# Do not import superseded harness-level settings, commands, or skills.
disabledProviders:
  - codex
  - opencode
  - claude
  - gemini
  - github
  - cursor
  - agents
  # No local inference servers run on the fleet. Skip dead-port discovery.
  - llama.cpp
  - lm-studio
  - ollama

# Keep the system-prompt prefix stable across role switches so Grok cache hits.
includeModelInPrompt: false

# Keep every new session at medium unless it is explicitly overridden.
# Grok 4.6 thinking.defaultLevel in models.yml must stay medium too; that
# model override is what new sessions start with and otherwise supersedes this.
defaultThinkingLevel: medium
hideThinkingBlock: true
# Skip thinking-summary tokens on the wire when the provider supports it.
omitThinking: true


retry:
  enabled: true
  # Thinking-loop aborts are retryable stream stalls. The detector already
  # injects thinking-loop-redirect; one same-provider resample lets SuperGrok
  # act on that notice. maxRetries 0 skipped that and billed OpenRouter on
  # the first stall. Exhausted budget still falls through to overflow.
  maxRetries: 1
  baseDelayMs: 2000
  maxDelayMs: 60000
  modelFallback: true
  # Return to SuperGrok after the overflow cooldown instead of staying on
  # the paid path for the rest of the session.
  fallbackRevertPolicy: cooldown-expiry
  # Per-role chains. SuperGrok quota walls fall to Antigravity then GLM,
  # never to paid OpenRouter Grok.
  fallbackChains:
    default:
      - google-antigravity/gemini-3.8-flash:high
      - openrouter/z-ai/glm-5.3
    slow:
      - openrouter/z-ai/glm-5.3:max
      - openrouter/moonshotai/kimi-k3:max
      - google-antigravity/gemini-3.8-flash:high
    plan:
      - google-antigravity/gemini-3.8-flash:high
      - openrouter/z-ai/glm-5.3:high
    vision:
      - xai-oauth/grok-4.6
    commit:
      - google-antigravity/gemini-3.8-flash:low
    smol:
      - openrouter/z-ai/glm-5.3-flash
    tiny:
      - openrouter/z-ai/glm-5.3-flash:low
    task:
      - openrouter/z-ai/glm-5.3-flash
      - openrouter/z-ai/glm-5.3

task:
  maxConcurrency: 3
  maxRecursionDepth: 2
  # Keep delegation on the default path without injecting eager instructions.
  eager: default
  # Main's LSP remains available; worker LSP is opt-in to avoid startup cost.
  enableLsp: false
  # Surface the resolved worker model for cheap routing verification.
  showResolvedModelBadge: true
  # Subagents leave SuperGrok. Reviewer/security stay on the session model.
  # Override keys are bundled agent ids (sonic/scout/task). Agent files use
  # @smol/@task so a model switch is config.yml only. There is no bundled
  # agent named luna; do not add a fake subagent id.
  agentModelOverrides:
    sonic: "@smol"
    scout: "@smol"
    task: "@task"
  # Skip the redundant filesystem walk for each delegated task.
  prewalk: false

# Keep the native prewalk feature explicitly disabled for snappier startup.
prewalk:
  enabled: false

# Keep the LSP service available while loading it only when requested.
lsp:
  enabled: true
  lazy: true

tools:
  approvalMode: yolo
  intentTracing: false
  xdev: true
  # Catalog lists xd:// devices; schemas load on demand (~3500 fewer prefix tokens).
  xdevDocs: catalog

github:
  enabled: true

astGrep:
  enabled: true

bash:
  autoBackground:
    enabled: true
    # Foreground bash blocked the turn for 15-60s. Background after 15s and
    # deliver the result when the command finishes.
    thresholdMs: 15000

# SuperGrok cache is prefix-exact. Auto only covers DeepSeek/Xiaomi/Anthropic.
provider:
  appendOnlyContext: on

# Compact before xAI's 200k long-context price/quota cliff (500k window).
# 17.4 dropped compaction.strategy. methodOrder is the live list; snapcompact
# is first and the only method we want. Do not add remote/soft/handoff: those
# are extra Grok calls. mid-turn and idle stay off because snapcompact frames
# leave stored text at ~95-168k while the mid-turn estimate sits at 180-187k
# and would re-snap the same archive between provider calls. Post-turn still
# enforces 180k. asyncEnabled default is on and would speculate the first
# LLM-backed method (remote/soft) near threshold; we have none, so keep it off.
compaction:
  enabled: true
  methodOrder:
    - snapcompact
  asyncEnabled: false
  thresholdTokens: 180000
  midTurnEnabled: false
  keepRecentTokens: 20000
  autoContinue: true
  dropUseless: true
  supersedeReads: true
  idleEnabled: false

recap:
  # Extra Grok 4.6 call after 240s idle. Same model as the working
  # turn; fires while the session is already sitting on the compact cliff.
  enabled: false

theme:
  dark: ghostty

symbolPreset: nerd

statusLine:
  preset: custom
  separator: powerline
  compactThinkingLevel: true
  leftSegments:
    - hostname
    - model
    - path
  rightSegments:
    - token_in
    - token_out
    - cache_read
    - token_rate
  segmentOptions:
    model:
      showThinkingLevel: true
    path:
      abbreviate: true
      maxLength: 60
      stripWorkPrefix: true

display:
  showTokenUsage: false
  cacheMissMarker: true
  hideToolActivity: true
  shimmer: disabled
  # Tokens appear as they arrive; no client-side reveal delay.
  smoothStreaming: false

title:
  # First-message titles stay and use the tiny role (GLM-5.3-Flash).
  # Replan titles stay off so they do not contend with the working turn.
  refreshOnReplan: false


terminal:
  # OSC 9;4 Kitty/Ghostty tab progress while a turn or compaction runs.
  showProgress: false

power:
  sleepPrevention: display

advisor:
  enabled: false

features:
  # OMP already detects repeated streams. Do not let a local classifier
  # independently resume a stopped turn and recreate the same work.
  unexpectedStopDetection: false

providers:
  # Default OpenRouter routing (price/uptime). :nitro and luna remain manual enabledModels picks.
  openrouterVariant: default
  # xAI search is grok-4.5 + web_search (24-53s here). Public Web races
  # Startpage/DDG in ~5s with no key. If that fan-out fails, try each
  # scraper alone before the model-backed fallback.
  webSearchOrder:
    - public
    - startpage
    - duckduckgo
    - xai
  webSearchExclude:
    - google
    - ecosia
    - mojeek
  imageOrder:
    - xai
  # The tiny role (GLM-5.3-Flash) is an online model.
  # Never start an embedded ONNX model worker.
  tinyModel: online
  memoryModel: online
  autoThinkingModel: online
  unexpectedStopModel: online
  autoThinkingMaxEffort: medium

# enablePi* is the native ~/.omp/agent/skills and .omp/skills gate (legacy name).
# Leave Codex/Claude/Agents off so foreign harness skills stay out.
skills:
  enableCodexUser: false
  enableClaudeUser: false
  enableClaudeProject: false
  enablePiUser: true
  enablePiProject: true
  enableAgentsUser: false
  enableAgentsProject: false

commands:
  enableClaudeUser: false
  enableClaudeProject: false
  enableOpencodeUser: false
  enableOpencodeProject: false

bashInterceptor:
  enabled: true

secrets:
  enabled: true

startup:
  quiet: true
  showSplash: false
  setupWizard: false
  checkUpdate: false
  changelogMode: hidden

marketplace:
  autoUpdate: off

memory:
  backend: off

dev:
  autoqaConsent: denied
