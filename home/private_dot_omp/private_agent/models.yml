# Managed by chezmoi. Pins Grok 4.6 session thinking to medium so the catalog
# default cannot silently supersede config.yml defaultThinkingLevel. low,
# medium, high, and xhigh remain available for explicit per-session overrides.
providers:
  xai-oauth:
    modelOverrides:
      grok-4.6:
        reasoning: true
        thinking:
          mode: effort
          defaultLevel: medium
          efforts:
            - low
            - medium
            - high
            - xhigh
        compat:
          supportsReasoningEffort: true
          omitReasoningEffort: false
