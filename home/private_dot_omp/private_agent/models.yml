# Managed by chezmoi. Pins Grok 4.6 session thinking to medium so the catalog
# default cannot silently supersede config.yml defaultThinkingLevel. low,
# medium, high, and xhigh remain available for explicit per-session overrides.
# GLM-5.3-Flash has no medium. defaultLevel is low for titles and tiny.
# Subagent effort lives on unpacked agent files (@smol/@task), not here.
providers:
  xai-oauth:
    modelOverrides:
      grok-4.6:
        reasoning: true
        thinking:
          mode: effort
          defaultLevel: medium
          efforts:
            - low
            - medium
            - high
            - xhigh
        compat:
          supportsReasoningEffort: true
          omitReasoningEffort: false
  openrouter:
    modelOverrides:
      z-ai/glm-5.3-flash:
        reasoning: true
        thinking:
          mode: effort
          defaultLevel: low
          efforts:
            - low
            - high
            - max
        compat:
          supportsReasoningEffort: true
          omitReasoningEffort: false
