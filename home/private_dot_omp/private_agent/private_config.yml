# Managed by chezmoi. Credentials, sessions and account usage stay local.
# Claude Opus directs; nous/Luna handle bounded work under parent-run checks.
# Astra is evidence-triggered escalation; Fable is the Anthropic-pool alternative.
modelRoles:
  default: anthropic/claude-opus-5-5:medium
  slow: openai-codex/gpt-6-astra:xhigh
  plan: openai-codex/gpt-6-astra:medium
  vision: openai-codex/gpt-6-luna:medium
  commit: openai-codex/gpt-6-luna:low
  smol: openai-codex/gpt-6-luna:low
  tiny: openai-codex/gpt-6-luna:low
  task: openai-codex/gpt-6-luna:medium
  # Scarce Anthropic weekly pool (capped at half of it); see RULES.md.
  fable: anthropic/claude-fable-5-1:medium
  # Keyless search only; provider-backed search stays an explicit choice.
  web: web/public

modelProviderOrder:
  - anthropic
  - openai-codex
  - llama.cpp
  - openrouter

cycleOrder:
  - default
  - fable
  - task

enabledModels:
  - anthropic/claude-opus-5-5
  - anthropic/claude-fable-5-1
  - openai-codex/gpt-6-astra
  - openai-codex/gpt-6-luna
  - llama.cpp/*
  - openrouter/z-ai/glm-5.3-flash
  - openrouter/z-ai/glm-5.3
  - openrouter/moonshotai/kimi-k3
  - openrouter/openai/gpt-6-luna

# These are foreign configuration discovery adapters, not model providers.
disabledProviders:
  - codex
  - opencode
  - claude
  - gemini
  - github
  - cursor
  - agents
  - lm-studio
  - ollama

includeModelInPrompt: false
defaultThinkingLevel: medium
# Shorter answers, not less reasoning.
textVerbosity: low
hideThinkingBlock: true
omitThinking: true
tier:
  openai: default
extendedContext: false
contextPromotion:
  enabled: false

spelling:
  typoDetection: false
  autocomplete: false
  autocorrect: false

composer:
  shape: box
retry:
  enabled: true
  maxRetries: 1
  baseDelayMs: 2000
  maxDelayMs: 60000
  # Account rotation is native OAuth behavior. Do not silently change models
  # or turn a local job into paid cloud inference on failure.
  modelFallback: false
  fallbackChains:
    web: [web/startpage, web/duckduckgo]

task:
  maxConcurrency: 3
  maxRecursionDepth: 1
  eager: default
  enableLsp: false
  # Per-task choice without an extra classifier call. Omit for configured medium;
  # coarse "med" maps to high on every cloud model, not medium.
  enableEffort: true
  showResolvedModelBadge: true
  softRequestBudget: 40
  maxRuntimeMs: 600000
  agentModelOverrides:
    sonic: "@smol"
    scout: "@smol"
    task: "@task"
  prewalk: false
  # Unrouted bundled agents; hidden to keep the task description lean.
  disabledAgents: [reviewer, security-reviewer]

todo:
  enabled: false


prewalk:
  enabled: false
lsp:
  enabled: true
  lazy: true
tools:
  approvalMode: yolo
  intentTracing: false
  xdev: true
  xdevDocs: catalog
github:
  enabled: true
astGrep:
  enabled: true
bash:
  autoBackground:
    enabled: true
    thresholdMs: 15000

# Native per-provider behavior; avoid the prior Grok-specific forced policy.
provider:
  appendOnlyContext: auto
compaction:
  enabled: true
  methodOrder:
    - remote
    - handoff
    - soft
  asyncEnabled: false
  thresholdTokens: -1
  thresholdPercent: -1
  midTurnEnabled: true
  keepRecentTokens: 8000
  autoContinue: true
  dropUseless: true
  supersedeReads: true
  idleEnabled: false
recap:
  enabled: false
computer:
  enabled: true

theme:
  dark: ghostty

symbolPreset: nerd

statusLine:
  preset: custom
  separator: none
  compactThinkingLevel: true
  transparent: true
  leftSegments:
    - model
    - path
  rightSegments:
    - token_rate
  segmentOptions:
    model:
      showThinkingLevel: true
    path:
      abbreviate: true
      maxLength: 60
      stripWorkPrefix: true

display:
  # Keep agent/model identity visible without the expanded live roster.
  pinnedAgents: collapsed
  showTokenUsage: false
  cacheMissMarker: true
  hideToolActivity: true
  shimmer: disabled
  # Tokens appear as they arrive; no client-side reveal delay.
  smoothStreaming: false

tui:
  # Ghostty deliberately uses a blank fixed title; do not animate a hidden title.
  titleState: false

title:
  # First-message titles use the tiny role.
  # Replan titles stay off so they do not contend with the working turn.
  refreshOnReplan: false


terminal:
  # OSC 9;4 Kitty/Ghostty tab progress while a turn or compaction runs.
  showProgress: false

power:
  sleepPrevention: display

advisor:
  enabled: false

features:
  # OMP already detects repeated streams. Do not let a local classifier
  # independently resume a stopped turn and recreate the same work.
  unexpectedStopDetection: none

providers:
  openrouterVariant: default

# enablePi* is the native ~/.omp/agent/skills and .omp/skills gate (legacy name).
# Leave Codex/Claude/Agents off so foreign harness skills stay out.
skills:
  enableCodexUser: false
  enableClaudeUser: false
  enableClaudeProject: false
  enablePiUser: true
  enablePiProject: true
  enableAgentsUser: false
  enableAgentsProject: false

commands:
  enableClaudeUser: false
  enableClaudeProject: false
  enableOpencodeUser: false
  enableOpencodeProject: false

bashInterceptor:
  enabled: true

secrets:
  enabled: true

startup:
  quiet: true
  showSplash: false
  setupWizard: false
  checkUpdate: false
  changelogMode: hidden

# Herdr owns agent alerts via herdr-omp-agent-state (active-tab aware);
# OMP's own `herdr notification show` would fire a second toast and sound.
completion:
  notify: off

ask:
  notify: off

marketplace:
  autoUpdate: off

memory:
  backend: off

dev:
  autoqaConsent: denied
