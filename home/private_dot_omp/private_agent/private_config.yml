# Managed by chezmoi. Credentials, sessions and account usage stay local.
# Luna executes routine work; Astra is available for planning and hard decisions.
# nous is a bounded local lane, selected by agent/task suitability.
modelRoles:
  default: openai-codex/gpt-5.6-luna:medium
  slow: openai-codex/gpt-6-astra:xhigh
  plan: openai-codex/gpt-6-astra:medium
  vision: openai-codex/gpt-5.6-luna:medium
  commit: openai-codex/gpt-5.6-luna:low
  smol: openai-codex/gpt-5.6-luna:low
  tiny: openai-codex/gpt-5.6-luna:low
  task: openai-codex/gpt-5.6-luna:medium

modelProviderOrder:
  - openai-codex
  - llama.cpp
  - bonsai
  - openrouter

cycleOrder:
  - default
  - plan

enabledModels:
  - openai-codex/gpt-6-astra
  - openai-codex/gpt-5.6-luna
  - openai-codex/gpt-5.6-sol
  - openai-codex/gpt-5.6-terra
  - llama.cpp/*
  - bonsai/*
  - openrouter/z-ai/glm-5.3-flash
  - openrouter/z-ai/glm-5.3
  - openrouter/moonshotai/kimi-k3
  - openrouter/openai/gpt-5.6-luna

# These are foreign configuration discovery adapters, not model providers.
disabledProviders:
  - codex
  - opencode
  - claude
  - gemini
  - github
  - cursor
  - agents
  - lm-studio
  - ollama

includeModelInPrompt: false
defaultThinkingLevel: medium
hideThinkingBlock: true
omitThinking: true
tier:
  openai: default
extendedContext: false
contextPromotion:
  enabled: false

retry:
  enabled: true
  maxRetries: 1
  baseDelayMs: 2000
  maxDelayMs: 60000
  # Account rotation is native OAuth behavior. Do not silently change models
  # or turn a local job into paid cloud inference on failure.
  modelFallback: false

task:
  maxConcurrency: 3
  maxRecursionDepth: 1
  eager: default
  enableLsp: false
  showResolvedModelBadge: true
  softRequestBudget: 40
  maxRuntimeMs: 600000
  agentModelOverrides:
    sonic: "@smol"
    scout: "@smol"
    task: "@task"
  prewalk: false

prewalk:
  enabled: false
lsp:
  enabled: true
  lazy: true
tools:
  approvalMode: yolo
  intentTracing: false
  xdev: true
  xdevDocs: catalog
github:
  enabled: true
astGrep:
  enabled: true
bash:
  autoBackground:
    enabled: true
    thresholdMs: 15000

# Native per-provider behavior; avoid the prior Grok-specific forced policy.
provider:
  appendOnlyContext: auto
compaction:
  enabled: true
  methodOrder:
    - remote
    - handoff
    - soft
  asyncEnabled: false
  thresholdTokens: -1
  thresholdPercent: -1
  midTurnEnabled: true
  keepRecentTokens: 8000
  autoContinue: true
  dropUseless: true
  supersedeReads: true
  idleEnabled: false
recap:
  enabled: false
computer:
  enabled: true

theme:
  dark: ghostty

symbolPreset: nerd

statusLine:
  preset: custom
  separator: powerline
  compactThinkingLevel: true
  leftSegments:
    - hostname
    - model
    - path
  rightSegments:
    - token_in
    - token_out
    - cache_read
    - token_rate
  segmentOptions:
    model:
      showThinkingLevel: true
    path:
      abbreviate: true
      maxLength: 60
      stripWorkPrefix: true

display:
  showTokenUsage: false
  cacheMissMarker: true
  hideToolActivity: true
  shimmer: disabled
  # Tokens appear as they arrive; no client-side reveal delay.
  smoothStreaming: false

title:
  # First-message titles use Luna/low through the tiny role.
  # Replan titles stay off so they do not contend with the working turn.
  refreshOnReplan: false


terminal:
  # OSC 9;4 Kitty/Ghostty tab progress while a turn or compaction runs.
  showProgress: false

power:
  sleepPrevention: display

advisor:
  enabled: false

features:
  # OMP already detects repeated streams. Do not let a local classifier
  # independently resume a stopped turn and recreate the same work.
  unexpectedStopDetection: false

providers:
  openrouterVariant: default
  # Prefer keyless search; optional provider-backed search stays explicit.
  webSearchOrder:
    - public
    - startpage
    - duckduckgo
  webSearchExclude:
    - google
    - ecosia
    - mojeek
  tinyModel: online
  memoryModel: online
  autoThinkingModel: online
  unexpectedStopModel: online

# enablePi* is the native ~/.omp/agent/skills and .omp/skills gate (legacy name).
# Leave Codex/Claude/Agents off so foreign harness skills stay out.
skills:
  enableCodexUser: false
  enableClaudeUser: false
  enableClaudeProject: false
  enablePiUser: true
  enablePiProject: true
  enableAgentsUser: false
  enableAgentsProject: false

commands:
  enableClaudeUser: false
  enableClaudeProject: false
  enableOpencodeUser: false
  enableOpencodeProject: false

bashInterceptor:
  enabled: true

secrets:
  enabled: true

startup:
  quiet: true
  showSplash: false
  setupWizard: false
  checkUpdate: false
  changelogMode: hidden

marketplace:
  autoUpdate: off

memory:
  backend: off

dev:
  autoqaConsent: denied
