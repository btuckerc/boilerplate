# Managed by chezmoi. Codex models inherit the native catalog; roles/effort
# live in config.yml. Only the local provider needs a custom definition.
providers:
  vllm:
    baseUrl: http://100.83.125.83:8080/v1
    api: openai-completions
    auth: none
    models:
      - id: DaisyRose-27B-Quark-MXFP4
        name: Nous DaisyRose 27B Quark MXFP4
        reasoning: true
        input: [text, image]
        contextWindow: 262144
        maxTokens: 16384
        cost: {input: 0, output: 0, cacheRead: 0, cacheWrite: 0}
        thinking:
          mode: effort
          defaultLevel: medium
          efforts: [low, medium, xhigh]
        compat:
          supportsStore: false
          supportsDeveloperRole: false
          maxTokensField: max_tokens
          extraBody:
            min_p: 0
