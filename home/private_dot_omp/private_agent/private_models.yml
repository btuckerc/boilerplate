# Managed by chezmoi. Cloud models inherit the native catalog; roles/effort
# live in config.yml. OpenRouter is an explicit alternative, never a fallback.
providers:
  openrouter:
    modelOverrides:
      z-ai/glm-5.3-flash:
        reasoning: true
        thinking:
          mode: effort
          defaultLevel: low
          efforts: [low, high, max]
        compat:
          supportsReasoningEffort: true
          omitReasoningEffort: false
  anthropic:
    # A 1M budget defers compaction to ~850K, and every request re-reads that
    # context from cache against the weekly pool. Match the Codex 272K budget;
    # `/extended-context on` restores 1M for a session that needs it.
    modelOverrides:
      claude-opus-5-5: {contextWindow: 272000, maxContextWindow: 1000000}
      claude-fable-5-1: {contextWindow: 272000, maxContextWindow: 1000000}
  llama.cpp:
    baseUrl: http://100.83.125.83:8080/v1
    api: openai-completions
    auth: none
    discovery:
      type: llama.cpp
      timeoutMs: 1000
    # Qwen is the promoted worker; discovery keeps smaller installed models
    # available for explicit selection.
    models:
      - id: Qwen3.8-27B-GSQ-RCO-IQ3_S-mtp
        name: Nous Qwen 3.8 27B GSQ-RCO IQ3_S
        reasoning: true
        input: [text]
        contextWindow: 131072
        maxTokens: 8192
        cost: {input: 0, output: 0, cacheRead: 0, cacheWrite: 0}
        thinking:
          mode: effort
          defaultLevel: medium
          efforts: [low, medium, xhigh]
        compat:
          supportsStore: false
          supportsDeveloperRole: false
          supportsReasoningEffort: true
          omitReasoningEffort: false
          maxTokensField: max_tokens
    modelOverrides:
      Qwen3.8-27B-GSQ-RCO-IQ3_S-mtp:
        contextWindow: 131072
        maxTokens: 8192
        compat:
          maxTokensField: max_tokens
          # Match Qwen's thinking sampler; other clients keep server defaults.
          extraBody:
            min_p: 0
      Ornith-1.5-9B-Q5_K_M:
        contextWindow: 16384
        maxTokens: 2048
        compat:
          maxTokensField: max_tokens
      gemma-4-12B-it-Q4_0:
        contextWindow: 16384
        maxTokens: 2048
        compat:
          maxTokensField: max_tokens
