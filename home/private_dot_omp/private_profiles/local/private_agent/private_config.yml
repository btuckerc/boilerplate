# Managed by chezmoi. `omp-local` (omp --profile local): every role runs on
# the local Swift Heretic Qwen on nous. No cloud provider has credentials or is
# enabled here, so nothing in this profile can reach paid inference.
modelRoles:
  default: vllm/Qwen3.8-27B-Swift-Heretic-MXFP4:medium
  slow: vllm/Qwen3.8-27B-Swift-Heretic-MXFP4:xhigh
  plan: vllm/Qwen3.8-27B-Swift-Heretic-MXFP4:xhigh
  vision: vllm/Qwen3.8-27B-Swift-Heretic-MXFP4:medium
  task: vllm/Qwen3.8-27B-Swift-Heretic-MXFP4:medium
  commit: vllm/Qwen3.8-27B-Swift-Heretic-MXFP4:low
  smol: vllm/Qwen3.8-27B-Swift-Heretic-MXFP4:low
  tiny: vllm/Qwen3.8-27B-Swift-Heretic-MXFP4:low
  # Inference stays local, but web searches contact third parties: keyless
  # APIs first (scrapers blocked as of 2026-10-14), Exa then the exact
  # fallbacks under retry.fallbackChains.web. No search credentials.
  web: web/exa

enabledModels:
  - vllm/*

# Foreign discovery adapters plus every cloud model provider.
disabledProviders:
  - codex
  - opencode
  - claude
  - gemini
  - github
  - cursor
  - agents
  - lm-studio
  - ollama
  - anthropic
  - openai-codex
  - openai
  - openrouter

includeModelInPrompt: false
defaultThinkingLevel: medium
textVerbosity: low
hideThinkingBlock: true
omitThinking: true

spelling:
  typoDetection: false
  autocomplete: false
  autocorrect: false

composer:
  shape: box
retry:
  enabled: true
  maxRetries: 1
  baseDelayMs: 2000
  maxDelayMs: 60000
  modelFallback: false
  # Exact web fallbacks; no web/hosted. Parallel's keyless adapter also sends
  # the session ID when available and the model ID.
  fallbackChains:
    web: [web/firecrawl, web/parallel]

task:
  # vLLM batches up to 8 sequences; cap child concurrency at 4 to avoid
  # exhausting the shared 399,968-token VRAM KV pool.
  maxConcurrency: 4
  maxRecursionDepth: 1
  eager: default
  enableLsp: false
  # OMP 18.10.2+ defaults this off, dropping yield and output schemas (scout).
  structured: true
  enableEffort: false
  showResolvedModelBadge: true
  softRequestBudget: 40
  maxRuntimeMs: 1200000
  prewalk: false
  disabledAgents: [reviewer, security-reviewer]

todo:
  enabled: false
prewalk:
  enabled: false
lsp:
  enabled: true
  lazy: true
tools:
  approvalMode: yolo
  intentTracing: false
  xdev: true
  xdevDocs: catalog
astGrep:
  enabled: true
bash:
  autoBackground:
    enabled: true
    thresholdMs: 15000

compaction:
  enabled: true
  methodOrder:
    - handoff
    - soft
  asyncEnabled: false
  thresholdTokens: -1
  thresholdPercent: -1
  midTurnEnabled: true
  keepRecentTokens: 8000
  autoContinue: true
  dropUseless: true
  supersedeReads: true
  idleEnabled: false
recap:
  enabled: false

theme:
  dark: ghostty
symbolPreset: nerd

statusLine:
  preset: custom
  separator: none
  compactThinkingLevel: true
  transparent: true
  leftSegments:
    - model
    - status
  rightSegments:
    - token_rate
  segmentOptions:
    model:
      showThinkingLevel: true

display:
  pinnedAgents: collapsed
  showTokenUsage: false
  cacheMissMarker: true
  hideToolActivity: true
  shimmer: disabled
  smoothStreaming: false

tui:
  titleState: false
title:
  refreshOnReplan: false
terminal:
  showProgress: false

advisor:
  enabled: false
features:
  unexpectedStopDetection: none

skills:
  enableCodexUser: false
  enableClaudeUser: false
  enableClaudeProject: false
  enablePiUser: true
  enablePiProject: true
  enableAgentsUser: false
  enableAgentsProject: false

commands:
  enableClaudeUser: false
  enableClaudeProject: false
  enableOpencodeUser: false
  enableOpencodeProject: false

bashInterceptor:
  enabled: true
secrets:
  enabled: true

startup:
  quiet: true
  showSplash: false
  setupWizard: false
  checkUpdate: false
  changelogMode: hidden

# Herdr owns agent alerts via the shared herdr-omp-agent-state extension.
completion:
  notify: off
ask:
  notify: off

marketplace:
  autoUpdate: off
memory:
  backend: off
dev:
  autoqaConsent: denied
