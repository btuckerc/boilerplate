# llama.cpp 61d447234, HIP with rocWMMA flash attention.
label = "tip-hip-wmma"
engine = "/home/tux/.local/opt/llama-61d447234-hip-wmma/bin/llama-server"
preset = "/home/tux/.config/llama/models.ini"
