what = "the vLLM candidates copied the fork quickstart's --skip-mm-profiling, which goes with images off, and turned images on: no VRAM was reserved for the vision encoder at 0.98 utilisation, so a large screenshot killed the engine. Changing one flag of an upstream recipe needs a check of the flags that assumed it"
guards = []
tests = ["test_candidate.py::test_serve_candidates_check_encoder_reservation"]

[[mistake]]
id = "M44"
what = "vLLM decode on the R9700 runs at one of two speeds per process, ~22% apart (6 of 18 blocks slow, once switching mid-process; ROCm/ROCm#6347), and the first full t2 averaged both states into one A/A of 0.80. One stable rerun after pinning vLLM off the E-cores was taken as the cause and written into docs and candidates; three more pinned runs showed the same split with no CPU contention, memory spill or power-profile change. A fix needs repeated A/As, not one. Now A/A beyond 2x tolerance blocks a pass, and ROCm candidates set GPU_MAX_HW_QUEUES=1 (upstream's mitigation; no cost here, not shown to prevent it)"
guards = []
tests = ["test_compare.py::test_a_candidate_running_in_two_states_cannot_pass"]

[[mistake]]
id = "M45"
what = "toolcall offered 8 tools while its session histories showed 73 calls to wait, task and web_search; both vLLM arms copied that history 6 times in 100 and were scored invalid, while llama.cpp (whose tool grammar I expect limits names to the offered set; not checked) never did. An eval fixture must not show the model actions it cannot take"
guards = []
tests = ["test_workloads_text.py::test_a_checkpoint_whose_history_calls_an_unoffered_tool_is_dropped"]

[[mistake]]
id = "M46"
what = "the first production-shaped vLLM start under nous-serve's read-only root died at the R4D_HYBRID import ('No module named aiter.ops.triton.unified_attention'): aiter JIT-builds into its package directory or AITER_JIT_DIR but only imports from the latter when set. nous-serve now points AITER_JIT_DIR into the writable home for every spec, instead of one spec carrying it"
guards = []
tests = ["serve/test_serve.py::test_jit_caches_go_to_the_writable_home_unless_the_spec_says_otherwise"]

[[mistake]]
id = "M47"
what = "llama-speedcheck's first threshold (150 t/s) came from an 800-token thinking-on smoke at 168 t/s; its own 512-token greedy probe decodes 142-143 t/s on every healthy process, so as installed it would have restarted healthy production twice an hour. Calibrated on production before the timer could act (127, the midpoint). A monitor's threshold comes from the monitor's own probe on the target, never from another benchmark"
guards = []
tests = ["serve/test_serve.py::test_the_hourly_budget_survives_across_runs"]

[[mistake]]
id = "M48"
what = "the first speedcheck draft restarted llama.service from a timer without the lease lock or a fresh state check, so a restart could land mid-lease or undo an intentional stop (audit BLOCK). Any automatic restarter takes /run/llama-yield.lock non-blocking and re-reads llama's invocation, enablement, leases and Bonsai under it"
guards = []
tests = ["serve/test_serve.py::test_no_restart_while_a_lease_caller_holds_the_lock", "serve/test_serve.py::test_no_restart_when_production_changed_or_the_gpu_is_claimed"]

[[mistake]]
id = "M49"
what = "the serve cutover passed guards.Host(plan=…) from runner.start, but Host had no plan field and G-models-readable still checked production only; every runner test ran without a lease, so 92 passing tests hid a TypeError that killed the first real run before its lease. A lease-path test now runs start() into the real Host and guard, and the guard checks every serve candidate in the plan"
guards = ["G-models-readable"]
tests = ["test_runner.py::test_a_candidate_model_production_does_not_use_is_checked_before_the_lease"]
