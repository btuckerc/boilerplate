id = "M61"
what = "the fifth to fifteenth release audits and an architect review (2026-11-06) found state that one process wrote and another inferred: a 'ran out' mark derived from the unit's deadline (a stop within the slack counted as ran out; the deadline was unknown before the unit was active; a stop that timed out also reports 'timeout'), a failure journal a SIGTERM could cut mid-write, a block-level end check vouching for rows another attempt wrote (an earlier pass for a failed retry, a retry's pass for a failed attempt's rows), compare reports and grades that outlived the rows they were computed from, canary files, run directories (and the directory entry of a new rows.jsonl), marker removals and the speedcheck restart budget not durable before they were relied on, restart guards (production idle, unit, leases) judged on a snapshot older than a blocking call, a binding check that read a record from another invocation than the snapshot it judged, older on-disk layouts (manifests, canary records) the new code crashed on or miscounted, a stopped run whose lease kept the GPU (systemd-run --wait leaves its unit running when the client dies), a lease stopped by name from outside llama-yield's lock (a successor lease could hold the name; a stop issued after a timed-out wait for the start job cancelled that job and production's restore), a lease llama-yield took as ended when systemd could not say, a stop path that wrote to a log first (a stalled reader blocked it before the lease was ended), a stopped run left without stopped.json or with a mark that was only in memory until the lease ended (a power cut made it recoverable), a mark that the lease's child wrote or cleared (a child killed at its runtime marked a run stopped that had run out; a starting child cleared a client's mark), and a run that recovery or the canary chose and then resumed although it was stopped meanwhile (the canary also graded a finished run without looking at its mark, and went on to t3), or that two processes ran at once (a second resume, the canary inside a lease, or an in-lease command that was not the one the client launched). Another lease follows only systemd's own result ('Finished with result: timeout' with a service runtime of at least the lease's); llama-yield, under its lock, stops its own lease on its caller's TERM/INT/HUP once the start job is done, holds the lock until systemd reports the unit ended, and restores production after every lease; the run's client alone marks a run stopped, at once and durably on its signal (only while it holds the run's lock; output only after the lease has ended) and after any lease that started and ended without running out on an unfinished run, and only a resume by hand clears it; the lease's child never writes or clears the mark and starts no run or block once it is set; one process runs a run (a flock on its `lock`; inside a lease only the command the client launched, holding the token the client wrote to `lease.claim` and `exec.lock`), and recovery and the canary decide under the lock, finished or not, leaving a stopped run alone; every row names its block attempt and counts only if that attempt passed its end check, any other row is measured again; a compare report carries the digest of the rows, grades and done.json it read, and promote and the watch accept it only while that still matches; the watch re-parses the record it compares and requires it to equal the judged snapshot"
guards = []
tests = ["test_runner.py::test_only_a_lease_that_ran_out_is_followed_by_another", "test_runner.py::test_stopping_the_run_marks_it_then_ends_its_lease", "test_runner.py::test_a_stopped_run_stays_stopped_whatever_its_lease_child_wrote", "test_runner.py::test_a_run_marked_stopped_starts_no_further_block", "test_runner.py::test_a_lease_that_ran_out_leaves_its_run_recoverable", "test_runner.py::test_boot_recovery_leaves_a_run_stopped_after_it_was_chosen", "test_runner.py::test_one_process_runs_a_run_at_a_time", "test_runner.py::test_inside_a_lease_only_the_command_its_client_launched_runs_the_run", "test_runner.py::test_only_rows_whose_attempt_passed_its_end_check_are_kept", "test_runner.py::test_a_run_from_before_attempts_resumes_by_measuring_its_rows_again", "test_store.py::test_graded_rows_substitute_only_the_row_they_graded", "test_build.py::test_promote_refuses_a_compare_older_than_the_rows", "test_build.py::test_a_canary_resumes_after_a_power_loss_took_its_cache_home", "test_build.py::test_a_canary_record_from_before_resumable_canaries_continues", "test_build.py::test_a_canary_run_from_before_resumable_canaries_is_its_first_attempt", "test_build.py::test_the_canary_leaves_a_stopped_run_stopped", "test_build.py::test_the_canary_does_not_go_on_from_a_finished_run_that_was_stopped", "test_watch.py::test_evidence_is_judged_only_for_the_spec_production_runs", "test_watch.py::test_production_without_passing_t2_and_t3_evidence_is_open", "serve/test_serve.py::test_no_restart_when_production_changed_or_the_gpu_is_claimed", "serve/test_serve.py::test_a_request_that_starts_while_the_budget_is_written_stops_a_slow_restart"]
