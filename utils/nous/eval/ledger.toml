# Mistakes that cost a run or put production at risk, and what now stops each
# from recurring. tests/test_ledger.py checks both directions: every guard named
# here declares the mistake (guards.py `mistakes=`), every guard that declares a
# mistake is named here, and every test exists (bare file names are in
# eval/tests, paths with a slash are relative to utils/nous). A new mistake gets
# an entry, a guard or a regression test (or both), in the same change that fixes it.

[[mistake]]
id = "M1"
what = "VRAM was read from a hard-coded card number; a reboot renumbered the cards"
guards = ["G-vram-sysfs"]
tests = ["test_guards.py::test_vram_sysfs_needs_exactly_one_card"]

[[mistake]]
id = "M2"
what = "A systemd user unit's PATH lacked ~/.local/bin tools and the mise Python"
guards = ["G-unit-path"]
tests = ["test_guards.py::test_unit_path_reports_missing_tools", "test_build.py::test_build_unit_uses_the_unit_path"]

[[mistake]]
id = "M3"
what = "A long job died with its terminal and could not resume"
guards = []
tests = ["test_runner.py::test_errors_fail_the_run_and_resume_retries_only_them", "test_build.py::test_build_unit_uses_the_unit_path"]

[[mistake]]
