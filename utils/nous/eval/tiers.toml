# What each tier measures. budget_s is the expected wall time of one block (one
# candidate pass) and sizes the GPU lease. Workload options: reps, workers
# (concurrent items; a one-slot router candidate needs `parallel = N` in its overrides),
# items_tier (which item set the workload's items() selects), plus
# workload-specific keys passed to items().

[tiers.t1]  # smoke: does the candidate boot, answer, call tools, see images
budget_s = 1800
design = "ab"
[tiers.t1.workloads]
speed = {}
longctx = {}
vision = {}
toolcall = {}
lcb = {}

[tiers.t2]  # engine/setting bake-off: speed, long context, agents, images
budget_s = 5400
design = "abba"
[tiers.t2.workloads]
speed = {reps = 3}
longctx = {}
replay = {}
concurrency = {}
vision = {}
grounding = {}
toolcall = {}

[tiers.canary]  # weekly upstream check: tip build vs production, unattended
budget_s = 3000
design = "abba"
[tiers.canary.workloads]
speed = {items_tier = "t2", reps = 2}
longctx = {items_tier = "t2", depths = [32768, 131072]}
replay = {items_tier = "t2"}
concurrency = {items_tier = "t2"}  # parallel agents were a reason for vLLM; a scheduler regression must show (council O-08)
vision = {items_tier = "t1"}
toolcall = {items_tier = "t2"}

# accuracy: LiveCodeBench medium+hard (258), 16K cap. Three reps per item: simulated at n=258,
# one rep gives a ±0.052 interval, three ±0.030, which a pass at the -0.04 margin needs
# (council A-02). Four workers: candidates/llamacpp-rvn-heretic-p4.toml is the four-slot llama.cpp arm.
[tiers.t3]
budget_s = 43200
design = "ab"
[tiers.t3.workloads]
lcb = {reps = 3, workers = 4}

[tiers.tune]  # one-factor tuning of production: one candidate file per setting, ABBA, many arms per run
budget_s = 1800
design = "abba"
[tiers.tune.workloads]
speed = {items_tier = "t2"}
longctx = {items_tier = "t2", depths = [32768, 131072]}
concurrency = {items_tier = "t2"}
vision = {items_tier = "t1"}
toolcall = {items_tier = "t1"}

[tiers.selftest]  # the harness itself, on a CPU candidate (candidates/cpu-selftest.toml, --no-lease)
budget_s = 600
design = "abba"
[tiers.selftest.workloads]
speed = {items_tier = "t1", max_tokens = 256}
lcb = {items_tier = "t1", max_tokens = 512}

[compare]
margin = -0.04     # rate metrics: non-inferior if the CI lower bound of B-A is above this
tolerance = 0.03   # ratio metrics: pass if the CI lower bound of B/A (better > 1) is above 1 - this

[guards]
min_eval_free_gib = 100
min_root_free_gib = 15
min_mem_available_gib = 24
max_loadavg = 4.0
max_idle_vram_mib = 2048
vram_settle_s = 60   # the driver frees a stopped server's VRAM over seconds
