# /etc/default/grub.d/99-nous-zswap.cfg on nous (source: utils/nous/memory-guard/).
# Compressed RAM cache (at most 10% of RAM) in front of the 32 GiB swapfile on
# /srv/models; run update-grub after changes.
GRUB_CMDLINE_LINUX_DEFAULT="${GRUB_CMDLINE_LINUX_DEFAULT} zswap.enabled=1 zswap.compressor=lzo zswap.max_pool_percent=10 zswap.shrinker_enabled=1"
