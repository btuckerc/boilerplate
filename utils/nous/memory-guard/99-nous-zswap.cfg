# /etc/default/grub.d/99-nous-zswap.cfg on nous (source: utils/nous/memory-guard/).
# Compressed RAM cache in front of the 8 GiB swapfile; run update-grub after changes.
GRUB_CMDLINE_LINUX_DEFAULT="${GRUB_CMDLINE_LINUX_DEFAULT} zswap.enabled=1 zswap.compressor=lzo zswap.max_pool_percent=20 zswap.shrinker_enabled=1"
