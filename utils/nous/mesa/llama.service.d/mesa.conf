[Service]
# Mesa 26.2.3 RADV from /opt/mesa-26.2 (install-mesa); system Mesa stays 26.0.8.
# 2026-10-02 rounds 22/24: prefill +7%, 86K-depth decode +6-11% over 26.0.8.
# Only the R9700 is visible, so it is Vulkan0 (models.ini). The newer libdrm is required.
Environment=VK_DRIVER_FILES=/opt/mesa-26.2/usr/share/vulkan/icd.d/radeon_icd.json
Environment=LD_LIBRARY_PATH=/opt/mesa-26.2/usr/lib/x86_64-linux-gnu
