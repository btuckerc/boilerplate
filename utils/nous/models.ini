; Native llama.cpp router presets. Model-specific settings belong here,
; not on ExecStart, whose flags override these settings.
version = 1

[*]
device = Vulkan1
n-gpu-layers = 999
ctx-size = 16384
flash-attn = on
cache-type-k = q8_0
cache-type-v = q8_0
parallel = 1
jinja = true
metrics = true

; Promoted worker. 128K f16 KV = 21.7 GB VRAM on the 32 GB R9700; q8 KV was
; slower at depth. load-mode none drops the 12 GB host mmap of the GGUF.
; MTP n-max 4 / p-min 0.4 won the 2026-09-25 sweep; the default 8 GiB
; cache-ram restores an evicted conversation without re-prefill.
[Qwen3.8-27B-GSQ-RCO-IQ3_S-mtp]
model = /srv/models/Qwen3.8-27B-GSQ-RCO-IQ3_S-mtp.gguf
ctx-size = 131072
cache-type-k = f16
cache-type-v = f16
load-mode = none
ubatch-size = 1024
ctx-checkpoints = 16
checkpoint-min-step = 1024
n-predict = 8192
fit = off
reasoning-effort = medium
spec-type = draft-mtp
spec-draft-n-max = 4
spec-draft-p-min = 0.4
device-draft = Vulkan1
gpu-layers-draft = 999
load-on-startup = true

; Previous default, kept selectable for rollback.
[Qwen3.8-27B-UD-Q5_K_M]
model = /srv/models/Qwen3.8-27B-UD-Q5_K_M.gguf
ctx-size = 65536
cache-type-k = f16
cache-type-v = f16
ubatch-size = 1024
checkpoint-min-step = 1024
n-predict = 8192
fit = off
reasoning-effort = medium
spec-type = draft-mtp
spec-draft-n-max = 3
device-draft = Vulkan1
gpu-layers-draft = 999
