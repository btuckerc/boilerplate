; Native llama.cpp router presets. Model-specific settings belong here,
; not on ExecStart, whose flags override these settings.
version = 1

[*]
device = Vulkan1
n-gpu-layers = 999
ctx-size = 16384
flash-attn = on
cache-type-k = q8_0
cache-type-v = q8_0
parallel = 1
jinja = true
metrics = true

; Promoted worker since 2026-09-25 (second round): unsloth UD-Q4_K_XL with the
; z-lab DFlash2 Q4_K_M drafter. KLD vs Q8_0 0.0058 (IQ3_S 0.054); decode +8%
; prose / +13% code / +5% at 86K over IQ3_S+MTP; 128K f16 KV peaks 28.2 GB.
; DFlash n-max 5 won n4-n6. load-mode none drops the host mmap of the GGUF;
; the default 8 GiB cache-ram restores an evicted conversation.
[Qwen3.8-27B-UD-Q4_K_XL]
model = /srv/models/Qwen3.8-27B-UD-Q4_K_XL.gguf
ctx-size = 131072
cache-type-k = f16
cache-type-v = f16
load-mode = none
ubatch-size = 1024
ctx-checkpoints = 16
checkpoint-min-step = 1024
n-predict = 8192
fit = off
reasoning-effort = medium
spec-type = draft-dflash
model-draft = /srv/drafters/Qwen3.8-27B-DFlash2-Q4_K_M.gguf
spec-draft-n-max = 5
device-draft = Vulkan1
gpu-layers-draft = 999
load-on-startup = true

; Previous promoted worker (GSQ-RCO IQ3_S with MTP), kept for rollback.
[Qwen3.8-27B-GSQ-RCO-IQ3_S-mtp]
model = /srv/models/Qwen3.8-27B-GSQ-RCO-IQ3_S-mtp.gguf
ctx-size = 131072
cache-type-k = f16
cache-type-v = f16
load-mode = none
ubatch-size = 1024
ctx-checkpoints = 16
checkpoint-min-step = 1024
n-predict = 8192
fit = off
reasoning-effort = medium
spec-type = draft-mtp
spec-draft-n-max = 4
spec-draft-p-min = 0.4
device-draft = Vulkan1
gpu-layers-draft = 999

; Earlier default, kept selectable.
[Qwen3.8-27B-UD-Q5_K_M]
model = /srv/models/Qwen3.8-27B-UD-Q5_K_M.gguf
ctx-size = 65536
cache-type-k = f16
cache-type-v = f16
ubatch-size = 1024
checkpoint-min-step = 1024
n-predict = 8192
fit = off
reasoning-effort = medium
spec-type = draft-mtp
spec-draft-n-max = 3
device-draft = Vulkan1
gpu-layers-draft = 999
