; Native llama.cpp router presets. Model-specific settings belong here,
; not on ExecStart, whose flags override these settings.
version = 1

[*]
device = Vulkan1
n-gpu-layers = 999
ctx-size = 16384
flash-attn = on
cache-type-k = q8_0
cache-type-v = q8_0
parallel = 1
jinja = true
metrics = true

[Qwen3.8-27B-UD-Q5_K_M]
model = /srv/models/Qwen3.8-27B-UD-Q5_K_M.gguf
ctx-size = 65536
ubatch-size = 1024
n-predict = 8192
fit = off
reasoning-effort = medium
spec-type = draft-mtp
spec-draft-n-max = 3
device-draft = Vulkan1
gpu-layers-draft = 999
load-on-startup = true
